<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>THE ⚔ CONQUEROR | Admin</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #070707;
  color: white;
  min-height: 100vh;
}

/* ================================
   LOGIN
================================ */

#loginPage {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;

  background:
    radial-gradient(
      circle at center,
      #4d1708 0%,
      #120806 40%,
      #070707 75%
    );
}

.login-box {
  width: 100%;
  max-width: 420px;
  background: #101010;
  border: 1px solid #292929;
  border-radius: 15px;
  padding: 30px;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

.login-logo {
  text-align: center;
  margin-bottom: 25px;
}

.login-logo h1 {
  color: #ff5b22;
  font-size: 30px;
}

.login-logo p {
  color: #888;
  margin-top: 8px;
}

.login-box label {
  display: block;
  font-size: 14px;
  font-weight: bold;
  margin-top: 18px;
}

.login-box input {
  width: 100%;
  padding: 14px;
  margin-top: 8px;
  background: #070707;
  color: white;
  border: 1px solid #333;
  border-radius: 8px;
  outline: none;
}

.login-box input:focus {
  border-color: #ff541c;
}

.main-button {
  width: 100%;
  margin-top: 22px;
  padding: 14px;
  border: none;
  border-radius: 8px;
  background: #ff541c;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.main-button:disabled {
  opacity: .6;
}

.login-error {
  display: none;
  margin-top: 15px;
  padding: 12px;
  border-radius: 8px;
  background: #3a0b0b;
  border: 1px solid #702020;
  color: #ff7777;
  word-break: break-word;
}

/* ================================
   DASHBOARD
================================ */

#dashboard {
  display: none;
}

header {
  padding: 20px;
  background: #101010;
  border-bottom: 1px solid #292929;
}

.header-inner {
  width: 94%;
  max-width: 1200px;
  margin: auto;

  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

header h1 {
  color: #ff5b22;
  font-size: 26px;
}

header p {
  color: #888;
  margin-top: 4px;
  font-size: 13px;
}

.logout {
  background: #333;
  color: white;
  border: none;
  padding: 11px 16px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.container {
  width: 94%;
  max-width: 1200px;
  margin: auto;
  padding: 30px 0;
}

/* ================================
   ERROR
================================ */

#error {
  display: none;
  background: #3a0b0b;
  border: 1px solid #702020;
  color: #ff7777;
  padding: 15px;
  border-radius: 8px;
  margin-bottom: 20px;
  word-break: break-word;
}

/* ================================
   STATS
================================ */

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
  margin-bottom: 25px;
}

.stat {
  background: #101010;
  border: 1px solid #292929;
  border-radius: 12px;
  padding: 20px;
}

.stat-title {
  color: #888;
  font-size: 12px;
}

.stat-number {
  font-size: 30px;
  font-weight: bold;
  margin-top: 8px;
  color: #ff652c;
}

/* ================================
   TOOLBAR
================================ */

.toolbar {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.search {
  flex: 1;
  padding: 14px;
  background: #101010;
  border: 1px solid #333;
  border-radius: 8px;
  color: white;
  outline: none;
}

.search:focus {
  border-color: #ff541c;
}

.refresh {
  padding: 12px 18px;
  border: none;
  border-radius: 8px;
  background: #ff541c;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

/* ================================
   TABLE
================================ */

.table-wrapper {
  overflow-x: auto;
  background: #101010;
  border: 1px solid #292929;
  border-radius: 12px;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 800px;
}

th,
td {
  padding: 15px;
  text-align: left;
  border-bottom: 1px solid #242424;
}

th {
  color: #ff652c;
  font-size: 13px;
}

td {
  font-size: 14px;
}

.status {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: bold;
  text-transform: uppercase;
}

.pending {
  background: #4a3200;
  color: #ffcc55;
}

.approved {
  background: #063b1b;
  color: #52e38b;
}

.rejected {
  background: #430909;
  color: #ff6969;
}

.action-button {
  border: none;
  padding: 7px 10px;
  border-radius: 6px;
  color: white;
  font-weight: bold;
  cursor: pointer;
  margin-right: 4px;
}

.approve {
  background: #087f3d;
}

.reject {
  background: #a71919;
}

.view {
  background: #333;
}

/* ================================
   APPLICATION DETAILS
================================ */

#details {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  padding: 20px;
  overflow-y: auto;
  z-index: 10;
}

.details-box {
  width: 100%;
  max-width: 650px;
  margin: 50px auto;
  background: #101010;
  border: 1px solid #333;
  border-radius: 15px;
  padding: 25px;
}

.details-box h2 {
  color: #ff652c;
  margin-bottom: 20px;
}

.detail-row {
  padding: 12px 0;
  border-bottom: 1px solid #242424;
}

.detail-label {
  color: #888;
  font-size: 12px;
  margin-bottom: 4px;
}

.detail-value {
  word-break: break-word;
}

.close-details {
  margin-top: 20px;
  background: #333;
  color: white;
  border: none;
  padding: 12px 18px;
  border-radius: 8px;
  cursor: pointer;
}

.loading {
  text-align: center;
  color: #888;
  padding: 30px;
}

/* ================================
   MOBILE
================================ */

@media (max-width: 700px) {

  .stats {
    grid-template-columns: 1fr 1fr;
  }

  .header-inner {
    align-items: flex-start;
  }

  .toolbar {
    flex-direction: column;
  }

  header h1 {
    font-size: 20px;
  }

}

</style>

</head>


<body>


<!-- ================================
     LOGIN PAGE
================================ -->

<section id="loginPage">

  <div class="login-box">

    <div class="login-logo">

      <h1>
        THEㅤ⚔ㅤCONQUEROR
      </h1>

      <p>
        Admin Dashboard
      </p>

    </div>


    <form id="loginForm">

      <label>

        Admin Email

        <input
          type="email"
          id="email"
          placeholder="Enter admin email"
          required
        >

      </label>


      <label>

        Password

        <input
          type="password"
          id="password"
          placeholder="Enter password"
          required
        >

      </label>


      <button
        type="submit"
        class="main-button"
        id="loginButton"
      >
        🔐 LOGIN
      </button>


      <div
        id="loginError"
        class="login-error"
      ></div>

    </form>

  </div>

</section>



<!-- ================================
     DASHBOARD
================================ -->

<section id="dashboard">


<header>

  <div class="header-inner">

    <div>

      <h1>
        THEㅤ⚔ㅤCONQUEROR
      </h1>

      <p>
        Guild Recruitment Admin Dashboard
      </p>

    </div>


    <button
      class="logout"
      id="logoutButton"
    >
      LOGOUT
    </button>

  </div>

</header>



<div class="container">


  <div id="error"></div>


  <!-- STATS -->

  <div class="stats">


    <div class="stat">

      <div class="stat-title">
        TOTAL APPLICATIONS
      </div>

      <div
        class="stat-number"
        id="total"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        PENDING
      </div>

      <div
        class="stat-number"
        id="pending"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        APPROVED
      </div>

      <div
        class="stat-number"
        id="approved"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        REJECTED
      </div>

      <div
        class="stat-number"
        id="rejected"
      >
        0
      </div>

    </div>


  </div>



  <!-- SEARCH -->

  <div class="toolbar">

    <input
      class="search"
      id="search"
      type="text"
      placeholder="Search by IGN or UID..."
    >


    <button
      class="refresh"
      id="refreshButton"
    >
      🔄 REFRESH
    </button>

  </div>



  <!-- APPLICATION TABLE -->

  <div class="table-wrapper">

    <table>

      <thead>

        <tr>

          <th>IGN</th>

          <th>UID</th>

          <th>ROLE</th>

          <th>RANK</th>

          <th>STATUS</th>

          <th>ACTION</th>

        </tr>

      </thead>


      <tbody id="applications">

        <tr>

          <td
            colspan="6"
            class="loading"
          >
            Loading applications...
          </td>

        </tr>

      </tbody>

    </table>

  </div>


</div>

</section>



<!-- ================================
     APPLICATION DETAILS
================================ -->

<div id="details">

  <div class="details-box">

    <h2>
      APPLICATION DETAILS
    </h2>

    <div id="detailsContent"></div>

    <button
      class="close-details"
      onclick="closeDetails()"
    >
      CLOSE
    </button>

  </div>

</div>



<script>

/*
========================================
SUPABASE CONFIGURATION
========================================
*/

const SUPABASE_URL =
  "https://muyggfhblazjqoewrxth.supabase.co";


const SUPABASE_ANON_KEY =
  "sb_publishable_M_7Cb2GtvzQqLftmUJE_1Q_fXB1e3Ma";


/*
========================================
VARIABLES
========================================
*/

let allApplications = [];

let accessToken = null;


/*
========================================
ELEMENTS
========================================
*/

const loginPage =
  document.getElementById(
    "loginPage"
  );

const dashboard =
  document.getElementById(
    "dashboard"
  );

const loginForm =
  document.getElementById(
    "loginForm"
  );

const loginButton =
  document.getElementById(
    "loginButton"
  );

const loginError =
  document.getElementById(
    "loginError"
  );

const errorBox =
  document.getElementById(
    "error"
  );

const applicationsTable =
  document.getElementById(
    "applications"
  );


/*
========================================
SUPABASE REQUEST HEADERS
========================================
*/

function authHeaders() {

  return {

    "apikey":
      SUPABASE_ANON_KEY,

    "Authorization":
      "Bearer " +
      accessToken

  };

}


/*
========================================
LOGIN
========================================
*/

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    loginError.style.display =
      "none";

    loginButton.disabled = true;

    loginButton.textContent =
      "LOGGING IN...";


    const email =
      document.getElementById(
        "email"
      ).value.trim();


    const password =
      document.getElementById(
        "password"
      ).value;


    try {

      const response =
        await fetch(

          SUPABASE_URL +
          "/auth/v1/token?grant_type=password",

          {

            method: "POST",

            headers: {

              "apikey":
                SUPABASE_ANON_KEY,

              "Content-Type":
                "application/json"

            },

            body:
              JSON.stringify({

                email:
                  email,

                password:
                  password

              })

          }

        );


      const result =
        await response.json();


      if (!response.ok) {

        throw new Error(
          result.error_description ||
          result.msg ||
          result.message ||
          "Invalid email or password."
        );

      }


      /*
      Save session
      */

      accessToken =
        result.access_token;


      localStorage.setItem(
        "tc_admin_access_token",
        result.access_token
      );


      if (
        result.refresh_token
      ) {

        localStorage.setItem(
          "tc_admin_refresh_token",
          result.refresh_token
        );

      }


      /*
      Show dashboard
      */

      showDashboard();


    }

    catch (error) {

      console.error(error);

      loginError.textContent =
        error.message;

      loginError.style.display =
        "block";

      loginButton.disabled =
        false;

      loginButton.textContent =
        "🔐 LOGIN";

    }

  }
);


/*
========================================
SHOW DASHBOARD
========================================
*/

function showDashboard() {

  loginPage.style.display =
    "none";

  dashboard.style.display =
    "block";

  loadApplications();

}


/*
========================================
LOGOUT
========================================
*/

document.getElementById(
  "logoutButton"
).addEventListener(
  "click",
  async function() {

    try {

      if (accessToken) {

        await fetch(
          SUPABASE_URL +
          "/auth/v1/logout",
          {

            method: "POST",

            headers: {
              ...authHeaders()
            }

          }
        );

      }

    }

    catch (error) {

      console.error(error);

    }


    accessToken = null;

    localStorage.removeItem(
      "tc_admin_access_token"
    );

    localStorage.removeItem(
      "tc_admin_refresh_token"
    );


    dashboard.style.display =
      "none";

    loginPage.style.display =
      "flex";


    loginForm.reset();

  }
);


/*
========================================
LOAD APPLICATIONS
========================================
*/

async function loadApplications() {

  errorBox.style.display =
    "none";


  applicationsTable.innerHTML = `

    <tr>

      <td
        colspan="6"
        class="loading"
      >
        Loading applications...
      </td>

    </tr>

  `;


  try {

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/applications?select=*&order=created_at.desc",

        {

          method: "GET",

          headers:
            authHeaders()

        }

      );


    const text =
      await response.text();


    if (!response.ok) {

      throw new Error(
        text ||
        "Could not load applications."
      );

    }


    allApplications =
      JSON.parse(text);


    updateStats();

    displayApplications(
      allApplications
    );


  }

  catch (error) {

    console.error(error);

    errorBox.textContent =
      "Could not load applications: " +
      error.message;

    errorBox.style.display =
      "block";


    applicationsTable.innerHTML = `

      <tr>

        <td
          colspan="6"
          class="loading"
        >
          Could not load applications.
        </td>

      </tr>

    `;

  }

}


/*
========================================
STATISTICS
========================================
*/

function updateStats() {

  document.getElementById(
    "total"
  ).textContent =
    allApplications.length;


  document.getElementById(
    "pending"
  ).textContent =
    allApplications.filter(
      app =>
        app.status === "pending"
    ).length;


  document.getElementById(
    "approved"
  ).textContent =
    allApplications.filter(
      app =>
        app.status === "approved"
    ).length;


  document.getElementById(
    "rejected"
  ).textContent =
    allApplications.filter(
      app =>
        app.status === "rejected"
    ).length;

}


/*
========================================
DISPLAY APPLICATIONS
========================================
*/

function displayApplications(
  applications
) {

  if (!applications.length) {

    applicationsTable.innerHTML = `

      <tr>

        <td
          colspan="6"
          class="loading"
        >
          No applications found.
        </td>

      </tr>

    `;

    return;

  }


  applicationsTable.innerHTML =
    applications.map(
      app => `

        <tr>

          <td>
            ${safe(app.ign)}
          </td>

          <td>
            ${safe(app.uid)}
          </td>

          <td>
            ${safe(app.player_role)}
          </td>

          <td>
            ${safe(app.player_rank)}
          </td>

          <td>

            <span
              class="status ${safe(app.status)}"
            >
              ${safe(app.status)}
            </span>

          </td>

          <td>

            <button
              class="action-button view"
              onclick="viewApplication('${safe(app.application_id)}')"
            >
              VIEW
            </button>


            ${
              app.status === "pending"

              ? `

                <button
                  class="action-button approve"
                  onclick="updateStatus('${safe(app.application_id)}','approved')"
                >
                  ✓
                </button>

                <button
                  class="action-button reject"
                  onclick="updateStatus('${safe(app.application_id)}','rejected')"
                >
                  ✕
                </button>

              `

              : ""

            }

          </td>

        </tr>

      `
    ).join("");

}


/*
========================================
SEARCH
========================================
*/

document.getElementById(
  "search"
).addEventListener(
  "input",
  function() {

    const term =
      this.value
        .toLowerCase()
        .trim();


    const filtered =
      allApplications.filter(
        app =>

          String(
            app.ign || ""
          )
          .toLowerCase()
          .includes(term)

          ||

          String(
            app.uid || ""
          )
          .toLowerCase()
          .includes(term)

      );


    displayApplications(
      filtered
    );

  }
);


/*
========================================
REFRESH
========================================
*/

document.getElementById(
  "refreshButton"
).addEventListener(
  "click",
  loadApplications
);


/*
========================================
VIEW APPLICATION
========================================
*/

function viewApplication(
  applicationId
) {

  const app =
    allApplications.find(
      item =>
        item.application_id ===
        applicationId
    );


  if (!app) {
    return;
  }


  const details =
    document.getElementById(
      "details"
    );


  const content =
    document.getElementById(
      "detailsContent"
    );


  content.innerHTML = `

    ${detail(
      "Application ID",
      app.application_id
    )}

    ${detail(
      "IGN",
      app.ign
    )}

    ${detail(
      "UID",
      app.uid
    )}

    ${detail(
      "Contact",
      app.contact
    )}

    ${detail(
      "Role",
      app.player_role
    )}

    ${detail(
      "Rank",
      app.player_rank
    )}

    ${detail(
      "Headshot",
      app.headshot
    )}

    ${detail(
      "Game Mode",
      app.game_mode
    )}

    ${detail(
      "Microphone",
      app.microphone
    )}

    ${detail(
      "Previous Guild",
      app.previous_guild
    )}

    ${detail(
      "Reason",
      app.reason
    )}

    ${detail(
      "Status",
      app.status
    )}

    ${detail(
      "Submitted",
      app.created_at
    )}

  `;


  details.style.display =
    "block";

}


/*
========================================
DETAIL ROW
========================================
*/

function detail(
  label,
  value
) {

  return `

    <div class="detail-row">

      <div class="detail-label">
        ${safe(label)}
      </div>

      <div class="detail-value">
        ${safe(value)}
      </div>

    </div>

  `;

}


/*
========================================
CLOSE DETAILS
========================================
*/

function closeDetails() {

  document.getElementById(
    "details"
  ).style.display =
    "none";

}


/*
========================================
APPROVE / REJECT
========================================
*/

async function updateStatus(
  applicationId,
  newStatus
) {

  const action =
    newStatus === "approved"
      ? "approve"
      : "reject";


  if (
    !confirm(
      "Are you sure you want to " +
      action +
      " this application?"
    )
  ) {

    return;

  }


  try {

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/applications" +
        "?application_id=eq." +
        encodeURIComponent(
          applicationId
        ),

        {

          method: "PATCH",

          headers: {

            ...authHeaders(),

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify({

              status:
                newStatus

            })

        }

      );


    const text =
      await response.text();


    if (!response.ok) {

      throw new Error(
        text ||
        "Could not update application."
      );

    }


    await loadApplications();

  }

  catch (error) {

    console.error(error);

    alert(
      "Could not update application:\n\n" +
      error.message
    );

  }

}


/*
========================================
HTML SAFETY
========================================
*/

function safe(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/*
========================================
CHECK EXISTING LOGIN
========================================
*/

async function checkExistingLogin() {

  const savedToken =
    localStorage.getItem(
      "tc_admin_access_token"
    );


  if (!savedToken) {

    return;

  }


  accessToken =
    savedToken;


  try {

    const response =
      await fetch(

        SUPABASE_URL +
        "/auth/v1/user",

        {

          method: "GET",

          headers:
            authHeaders()

        }

      );


    if (!response.ok) {

      throw new Error(
        "Session expired."
      );

    }


    showDashboard();

  }

  catch (error) {

    accessToken = null;

    localStorage.removeItem(
      "tc_admin_access_token"
    );

    localStorage.removeItem(
      "tc_admin_refresh_token"
    );

  }

}


/*
========================================
START
========================================
*/

checkExistingLogin();

</script>

</body>
</html>
